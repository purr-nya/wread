name: Build & Release Watch APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Prepare Signing Keystore
        id: prepare-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CUSTOM_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          CUSTOM_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "STORE_PASSWORD=${CUSTOM_STORE_PASS}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${CUSTOM_KEY_PASS}" >> $GITHUB_ENV
          else
            echo "No custom keystore secret provided. Generating valid release keystore..."
            STORE_PASS="${CUSTOM_STORE_PASS:-wristreader_pass}"
            KEY_PASS="${CUSTOM_KEY_PASS:-wristreader_pass}"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=WristReader, OU=SmartWatch, O=WristReader, L=City, ST=State, C=CN"
            echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          fi
          
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Organize APK Artifacts
        id: organize-apk
        run: |
          mkdir -p release-output
          # Locate release apk
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found release APK: $APK_PATH"
            cp "$APK_PATH" release-output/WristReader-release.apk
            echo "apk_path=release-output/WristReader-release.apk" >> $GITHUB_OUTPUT
          else
            echo "Error: Release APK not found!"
            exit 1
          fi

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WristReader-Release-APK
          path: release-output/WristReader-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/WristReader-release.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
